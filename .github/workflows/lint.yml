name: Lint & Checks

# Gradle-based static analysis. Runs on PRs directly, and on main as a required
# precondition of release.yml - which is why it is also callable.
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning
    env:
      # Fork PRs get a read-only token, so they skip the SARIF upload.
      CAN_UPLOAD_SARIF: >-
        ${{ github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Each check runs even if an earlier one failed, so one run reports everything.
      - name: ktlint (Spotless)
        run: ./gradlew spotlessCheck

      - name: detekt
        if: ${{ !cancelled() }}
        run: ./gradlew detektMain detektTest

      - name: Android Lint
        if: ${{ !cancelled() }}
        run: ./gradlew lintDebug

      # Annotates new findings on the PR. Baselined findings are not in the SARIF.
      - name: Upload detekt SARIF (main)
        if: >-
          !cancelled() && env.CAN_UPLOAD_SARIF == 'true'
          && hashFiles('app/build/reports/detekt/debug.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: app/build/reports/detekt/debug.sarif
          category: detekt-main

      - name: Upload detekt SARIF (tests)
        if: >-
          !cancelled() && env.CAN_UPLOAD_SARIF == 'true'
          && hashFiles('app/build/reports/detekt/debugUnitTest.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: app/build/reports/detekt/debugUnitTest.sarif
          category: detekt-test

      - name: Upload Android Lint SARIF
        if: >-
          !cancelled() && env.CAN_UPLOAD_SARIF == 'true'
          && hashFiles('app/build/reports/lint-results-debug.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: app/build/reports/lint-results-debug.sarif
          category: android-lint

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/detekt/
