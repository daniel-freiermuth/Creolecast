name: Lint & Checks

# Gradle-based static analysis. Runs on PRs directly, and on main as a required
# precondition of release.yml - which is why it is also callable.
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning
    env:
      # Fork PRs get a read-only token, so they skip the SARIF upload.
      CAN_UPLOAD_SARIF: >-
        ${{ github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      # Validates gradle-wrapper.jar against Gradle's published checksums and
      # caches Gradle User Home. `basic` is the MIT-licensed cache provider; the
      # default `enhanced` one is a proprietary component.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # Each check runs even if an earlier one failed, so one run reports everything.
      - name: ktlint (Spotless)
        run: ./gradlew spotlessCheck

      - name: detekt
        if: ${{ !cancelled() }}
        run: ./gradlew detektMain detektTest

      - name: Android Lint
        if: ${{ !cancelled() }}
        run: ./gradlew lintDebug

      # Annotates findings on the PR.
      - name: Upload detekt SARIF (main)
        if: >-
          !cancelled() && env.CAN_UPLOAD_SARIF == 'true'
          && hashFiles('app/build/reports/detekt/debug.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: app/build/reports/detekt/debug.sarif
          category: detekt-main

      - name: Upload detekt SARIF (tests)
        if: >-
          !cancelled() && env.CAN_UPLOAD_SARIF == 'true'
          && hashFiles('app/build/reports/detekt/debugUnitTest.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: app/build/reports/detekt/debugUnitTest.sarif
          category: detekt-test

      - name: Upload Android Lint SARIF
        if: >-
          !cancelled() && env.CAN_UPLOAD_SARIF == 'true'
          && hashFiles('app/build/reports/lint-results-debug.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: app/build/reports/lint-results-debug.sarif
          category: android-lint

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/detekt/
