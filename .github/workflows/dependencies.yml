name: Dependencies

# Gradle declares dependencies in build scripts, which GitHub can't parse, so the
# resolved graph is submitted from a build. On main this feeds Dependabot alerts;
# on PRs, dependency review fails the PR if it introduces a known-vulnerable
# dependency.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  submit-graph:
    # Fork PRs get a read-only token and cannot submit a graph.
    if: >-
      github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write # dependency graph submission
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Submit Gradle dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Only what the app and its tests run with. Build tooling (AGP's emulator
          # test platform bundles netty for its local gRPC link) never ships and is
          # kept current by Dependabot version updates instead.
          dependency-graph-include-configurations: '.*RuntimeClasspath'

  review:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    needs: submit-graph
    runs-on: ubuntu-latest
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          # The PR's Gradle snapshot is submitted by the job above; wait for it.
          retry-on-snapshot-warnings: true
