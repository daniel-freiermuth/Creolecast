name: Release

# Tags and releases are driven by the version in app/build.gradle.kts, which is
# also what F-Droid reads. Bump versionName + versionCode in a PR; merging it to
# main creates the tag and publishes the release.
#
# The APK is built UNSIGNED by Gradle and signed afterwards with apksigner, so
# the unsigned artifact stays byte-identical to what the F-Droid buildserver
# produces from the same commit. That is what lets the fdroiddata recipe use
# `Binaries:` and publish our signature instead of F-Droid's. Do not move
# signing into a Gradle signingConfig.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  # Nothing is tagged or published unless tests, lint, the repository checks and
  # a plain build all pass first. These are the same reusable workflows PRs run.
  tests:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read
      security-events: write

  repo-checks:
    uses: ./.github/workflows/repo-checks.yml
    permissions:
      contents: read

  verify-build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  tag:
    name: Tag on version change
    needs: [tests, lint, repo-checks, verify-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the release tag
    outputs:
      created: ${{ steps.check.outputs.created }}
      version: ${{ steps.check.outputs.version }}
      version_code: ${{ steps.check.outputs.version_code }}
    steps:
      # The step below pushes the tag with checkout's credential, so it is kept
      # (explicitly). This job uploads no artifacts, so it can't leak that way.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Read version and tag if new
        id: check
        run: |
          set -euo pipefail
          gradle_file=app/build.gradle.kts
          version=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/p' "$gradle_file")
          version_code=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\([0-9]\+\).*/\1/p' "$gradle_file")

          if [ -z "$version" ] || [ -z "$version_code" ]; then
            echo "::error::could not parse versionName/versionCode from $gradle_file"
            exit 1
          fi
          echo "versionName=$version versionCode=$version_code"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "tag v$version already exists, nothing to release"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ ! -f "fastlane/metadata/android/en-US/changelogs/$version_code.txt" ]; then
            echo "::error::missing fastlane/metadata/android/en-US/changelogs/$version_code.txt"
            echo "::error::F-Droid names changelogs by versionCode, not versionName"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "CreoleCast $version"
          git push origin "v$version"
          echo "created=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build signed APK
    needs: tag
    if: needs.tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: v${{ needs.tag.outputs.version }}
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - run: chmod +x gradlew

      # No keystore.properties is written, so the Gradle signingConfig stays
      # inactive and the output is the reproducible unsigned APK.
      - name: Build unsigned release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Sign with apksigner
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

          build_tools_dirs=("$ANDROID_HOME"/build-tools/*)
          build_tools=$(printf '%s\n' "${build_tools_dirs[@]}" | sort -V | tail -1)
          release_apks=(app/build/outputs/apk/release/*.apk)
          unsigned=${release_apks[0]}
          out="app/build/outputs/apk/release/CreoleCast-${VERSION}.apk"

          # F-Droid copies the signature onto its own build, so the payload must
          # be aligned identically before signing.
          "$build_tools/zipalign" -p -f 4 "$unsigned" "$out"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "env:KEY_PASSWORD" \
            "$out"
          "$build_tools/apksigner" verify --print-certs "$out"

          sha256sum "$out" | tee "$out.sha256"
          rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-apk
          path: |
            app/build/outputs/apk/release/CreoleCast-*.apk
            app/build/outputs/apk/release/CreoleCast-*.apk.sha256

  release:
    name: Publish GitHub release
    needs: [tag, build]
    if: needs.tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the GitHub release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: v${{ needs.tag.outputs.version }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-apk
          path: dist

      # IzzyOnDroid scrapes this release; F-Droid's `Binaries:` URL points at
      # the APK asset. Both need the filename to stay predictable.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.tag.outputs.version }}
          VERSION_CODE: ${{ needs.tag.outputs.version_code }}
        run: |
          set -euo pipefail
          notes="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          gh release create "v${VERSION}" \
            --title "CreoleCast ${VERSION}" \
            --notes-file "$notes" \
            dist/*
